<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Mechanoid / archotech pad, 5x5. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4c50"/><stop offset="0.5" stop-color="#2e3034"/><stop offset="1" stop-color="#1b1c1f"/>
    </linearGradient>
    <g id="vent"><rect x="0" y="0" width="64" height="6"/><rect x="0" y="12" width="64" height="6"/><rect x="0" y="24" width="64" height="6"/></g>
  </defs>

  <polygon points="160,8 480,8 632,160 632,480 480,632 160,632 8,480 8,160" fill="#111214" stroke="#050506" stroke-width="5"/>
  <polygon points="166,22 474,22 618,166 618,474 474,618 166,618 22,474 22,166" fill="url(#metal)" stroke="#5c5f66" stroke-width="2"/>

  <g fill="none" stroke="#151618" stroke-width="4">
    <path d="M22 250 L130 250 L180 200 L180 22"/><path d="M618 250 L510 250 L460 200 L460 22"/>
    <path d="M22 390 L130 390 L180 440 L180 618"/><path d="M618 390 L510 390 L460 440 L460 618"/>
    <path d="M180 120 L460 120"/><path d="M180 520 L460 520"/>
  </g>
  <g fill="#0c0d0f">
    <use href="#vent" transform="translate(288 40)"/><use href="#vent" transform="translate(288 570)"/>
    <use href="#vent" transform="translate(40 352) rotate(-90)"/><use href="#vent" transform="translate(570 352) rotate(-90)"/>
    <g id="cvent"><use href="#vent" transform="translate(96 136) rotate(-45) scale(0.6 1)"/></g>
    <use href="#cvent" transform="translate(640 0) scale(-1 1)"/>
    <use href="#cvent" transform="translate(0 640) scale(1 -1)"/>
    <use href="#cvent" transform="translate(640 640) scale(-1 -1)"/>
  </g>
  <g fill="#6a6d74" stroke="#0c0d0f" stroke-width="1.5">
    <circle cx="180" cy="36" r="4"/><circle cx="460" cy="36" r="4"/><circle cx="180" cy="604" r="4"/><circle cx="460" cy="604" r="4"/>
    <circle cx="36" cy="180" r="4"/><circle cx="604" cy="180" r="4"/><circle cx="36" cy="460" r="4"/><circle cx="604" cy="460" r="4"/>
    <circle cx="200" cy="120" r="4"/><circle cx="440" cy="120" r="4"/><circle cx="200" cy="520" r="4"/><circle cx="440" cy="520" r="4"/>
  </g>

  <g fill="none" stroke="#ff2a1f" stroke-width="3" filter="url(#glow)">
    <path d="M180 200 L236 256"/><path d="M460 200 L404 256"/><path d="M180 440 L236 384"/><path d="M460 440 L404 384"/>
    <polygon points="320,140 500,320 320,500 140,320"/>
    <path d="M320 120 V140 M320 500 V520 M120 320 H140 M500 320 H520"/>
  </g>
  <g fill="none" stroke="#ff4a3a" filter="url(#glow)">
    <circle cx="320" cy="320" r="110" stroke-width="5" stroke-dasharray="46 18"/>
    <circle cx="320" cy="320" r="230" stroke-width="2" stroke-dasharray="10 14" stroke-opacity="0.7"/>
  </g>

  <circle cx="320" cy="320" r="40" fill="#0a0a0c" stroke="#5c5f66" stroke-width="4"/>
  <circle cx="320" cy="320" r="24" fill="#3a0806" stroke="#ff2a1f" stroke-width="3" filter="url(#glow)"/>
  <circle cx="320" cy="320" r="10" fill="#ff6a50" filter="url(#glow)"/>
  <circle cx="315" cy="315" r="3" fill="#ffd8cc"/>
</svg>
