<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Medevac pad: hospital-style helipad with red cross, shows the 5x5 size. Symmetric. -->
  <!-- dark asphalt square -->
  <rect x="8" y="8" width="624" height="624" rx="10" fill="#4a4d52" stroke="#1a1b1e" stroke-width="6"/>
  <!-- tile seams -->
  <g stroke="#3f4247" stroke-width="3">
    <line x1="128" y1="8" x2="128" y2="632"/><line x1="256" y1="8" x2="256" y2="632"/>
    <line x1="384" y1="8" x2="384" y2="632"/><line x1="512" y1="8" x2="512" y2="632"/>
    <line x1="8" y1="128" x2="632" y2="128"/><line x1="8" y1="256" x2="632" y2="256"/>
    <line x1="8" y1="384" x2="632" y2="384"/><line x1="8" y1="512" x2="632" y2="512"/>
  </g>
  <!-- white edge line -->
  <rect x="30" y="30" width="580" height="580" fill="none" stroke="#efefea" stroke-width="8" stroke-dasharray="40 20"/>

  <!-- white touchdown circle with red rim -->
  <circle cx="320" cy="320" r="262" fill="#1a1b1e"/>
  <circle cx="320" cy="320" r="256" fill="#c7302a"/>
  <circle cx="320" cy="320" r="236" fill="#efefea"/>
  <circle cx="320" cy="320" r="200" fill="none" stroke="#c7302a" stroke-width="6" stroke-dasharray="26 16"/>

  <!-- red cross -->
  <path d="M276 150 h88 v126 h126 v88 h-126 v126 h-88 v-126 h-126 v-88 h126 z"
        fill="#c7302a" stroke="#5e1410" stroke-width="6" stroke-linejoin="round"/>
  <!-- centre target (active cell) -->
  <circle cx="320" cy="320" r="26" fill="#efefea" stroke="#5e1410" stroke-width="5"/>
  <circle cx="320" cy="320" r="9" fill="#c7302a"/>

  <!-- perimeter lights (green, aviation style) -->
  <g fill="#4cd964" stroke="#1a1b1e" stroke-width="3">
    <circle cx="320" cy="48" r="9"/><circle cx="320" cy="592" r="9"/>
    <circle cx="48" cy="320" r="9"/><circle cx="592" cy="320" r="9"/>
    <circle cx="48" cy="48" r="9"/><circle cx="592" cy="48" r="9"/>
    <circle cx="48" cy="592" r="9"/><circle cx="592" cy="592" r="9"/>
  </g>
</svg>
