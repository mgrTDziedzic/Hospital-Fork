<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <!-- Floor marking: subtle worn white paint, meant to sit on any floor. 3x3 tiles. -->
  <g fill="none" stroke="#f2f0e8" stroke-opacity="0.75" stroke-linecap="round">
    <circle cx="192" cy="192" r="150" stroke-width="8" stroke-dasharray="70 10 30 12 90 8"/>
    <circle cx="192" cy="192" r="40" stroke-width="5"/>
  </g>
  <!-- four small arrows pointing in -->
  <g fill="#f2f0e8" fill-opacity="0.75">
    <g id="arr"><path d="M192 84 l14 -16 h-8 v-28 h-12 v28 h-8 z"/></g>
    <use href="#arr" transform="rotate(90 192 192)"/>
    <use href="#arr" transform="rotate(180 192 192)"/>
    <use href="#arr" transform="rotate(270 192 192)"/>
  </g>
  <!-- centre dot -->
  <circle cx="192" cy="192" r="8" fill="#f2f0e8" fill-opacity="0.8"/>
  <!-- paint wear: small gaps painted in background-neutral dark to fake chipping -->
  <g fill="#000" fill-opacity="0.18">
    <circle cx="66" cy="120" r="5"/><circle cx="318" cy="268" r="4"/><circle cx="230" cy="44" r="3"/><circle cx="152" cy="336" r="4"/>
  </g>
</svg>
