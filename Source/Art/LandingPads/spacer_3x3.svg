<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <!-- Spacer landing pad: hexagonal plasteel deck with glowing rings and inward chevrons. 3x3 tiles. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4458"/><stop offset="1" stop-color="#1d2330"/>
    </linearGradient>
  </defs>

  <!-- hex base + bevel -->
  <polygon points="374,192 283,34 101,34 10,192 101,350 283,350" fill="#10141c" stroke="#06080c" stroke-width="5"/>
  <polygon points="356,192 274,50 110,50 28,192 110,334 274,334" fill="url(#deck)" stroke="#5a6680" stroke-width="2"/>

  <!-- panel seams radiating from centre -->
  <g stroke="#141a24" stroke-width="3">
    <line x1="192" y1="192" x2="356" y2="192"/><line x1="192" y1="192" x2="28" y2="192"/>
    <line x1="192" y1="192" x2="274" y2="50"/><line x1="192" y1="192" x2="110" y2="334"/>
    <line x1="192" y1="192" x2="110" y2="50"/><line x1="192" y1="192" x2="274" y2="334"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="#2d6e86" stroke-width="2" stroke-opacity="0.8">
    <path d="M70 150 h30 l14 -14 h22"/><path d="M314 234 h-30 l-14 14 h-22"/>
    <path d="M150 300 v-20 l10 -10"/><path d="M234 84 v20 l-10 10"/>
  </g>
  <g fill="#39e0ff"><circle cx="136" cy="136" r="3"/><circle cx="248" cy="248" r="3"/><circle cx="160" cy="270" r="3"/><circle cx="224" cy="114" r="3"/></g>

  <!-- glowing rings -->
  <g fill="none" filter="url(#glow)">
    <circle cx="192" cy="192" r="130" stroke="#39e0ff" stroke-width="4"/>
    <circle cx="192" cy="192" r="104" stroke="#39e0ff" stroke-width="3" stroke-dasharray="34 10" stroke-opacity="0.85"/>
    <circle cx="192" cy="192" r="44" stroke="#9bf2ff" stroke-width="3"/>
  </g>

  <!-- six inward chevrons -->
  <g fill="#39e0ff" filter="url(#glow)">
    <g id="chev"><path d="M192 72 l16 -12 v10 l-16 12 l-16 -12 v-10 z"/></g>
    <use href="#chev" transform="rotate(60 192 192)"/><use href="#chev" transform="rotate(120 192 192)"/>
    <use href="#chev" transform="rotate(180 192 192)"/><use href="#chev" transform="rotate(240 192 192)"/>
    <use href="#chev" transform="rotate(300 192 192)"/>
  </g>

  <!-- central target hex (active cell) -->
  <polygon points="222,192 207,166 177,166 162,192 177,218 207,218" fill="#0c1018" stroke="#9bf2ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="192" cy="192" r="8" fill="#e6fdff" filter="url(#glow)"/>

  <!-- vertex beacons -->
  <g fill="#ff4fd8" filter="url(#glow)">
    <circle cx="352" cy="192" r="5"/><circle cx="32" cy="192" r="5"/>
    <circle cx="272" cy="54" r="5"/><circle cx="112" cy="54" r="5"/>
    <circle cx="272" cy="330" r="5"/><circle cx="112" cy="330" r="5"/>
  </g>
</svg>
