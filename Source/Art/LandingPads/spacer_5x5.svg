<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Spacer landing pad, 5x5. -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4458"/><stop offset="1" stop-color="#1d2330"/>
    </linearGradient>
    <path id="chev" d="M320 150 l16 -12 v10 l-16 12 l-16 -12 v-10 z"/>
    <path id="chev2" d="M320 178 l16 -12 v10 l-16 12 l-16 -12 v-10 z"/>
  </defs>

  <polygon points="630,320 475,52 165,52 10,320 165,588 475,588" fill="#10141c" stroke="#06080c" stroke-width="5"/>
  <polygon points="602,320 461,76 179,76 38,320 179,564 461,564" fill="url(#deck)" stroke="#5a6680" stroke-width="2"/>
  <!-- inner panel hex -->
  <polygon points="500,320 410,164 230,164 140,320 230,476 410,476" fill="none" stroke="#141a24" stroke-width="3"/>

  <g stroke="#141a24" stroke-width="3">
    <line x1="320" y1="320" x2="602" y2="320"/><line x1="320" y1="320" x2="38" y2="320"/>
    <line x1="320" y1="320" x2="461" y2="76"/><line x1="320" y1="320" x2="179" y2="564"/>
    <line x1="320" y1="320" x2="179" y2="76"/><line x1="320" y1="320" x2="461" y2="564"/>
  </g>

  <g fill="none" stroke="#2d6e86" stroke-width="2" stroke-opacity="0.8">
    <path d="M90 270 h40 l14 -14 h30"/><path d="M550 370 h-40 l-14 14 h-30"/>
    <path d="M250 520 v-26 l12 -12"/><path d="M390 120 v26 l-12 12"/>
    <path d="M120 400 h36 l10 10 h20"/><path d="M520 240 h-36 l-10 -10 h-20"/>
    <path d="M220 130 l20 20 v24"/><path d="M420 510 l-20 -20 v-24"/>
  </g>
  <g fill="#39e0ff">
    <circle cx="174" cy="256" r="3"/><circle cx="466" cy="384" r="3"/><circle cx="262" cy="482" r="3"/><circle cx="378" cy="158" r="3"/>
    <circle cx="186" cy="410" r="3"/><circle cx="454" cy="230" r="3"/><circle cx="240" cy="174" r="3"/><circle cx="400" cy="466" r="3"/>
  </g>

  <g fill="none" filter="url(#glow)">
    <circle cx="320" cy="320" r="236" stroke="#39e0ff" stroke-width="4"/>
    <circle cx="320" cy="320" r="200" stroke="#39e0ff" stroke-width="3" stroke-dasharray="40 12" stroke-opacity="0.85"/>
    <circle cx="320" cy="320" r="130" stroke="#39e0ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="320" cy="320" r="44" stroke="#9bf2ff" stroke-width="3"/>
  </g>

  <!-- double chevrons x6 -->
  <g fill="#39e0ff" filter="url(#glow)">
    <use href="#chev"/><use href="#chev2"/>
    <g transform="rotate(60 320 320)"><use href="#chev"/><use href="#chev2"/></g>
    <g transform="rotate(120 320 320)"><use href="#chev"/><use href="#chev2"/></g>
    <g transform="rotate(180 320 320)"><use href="#chev"/><use href="#chev2"/></g>
    <g transform="rotate(240 320 320)"><use href="#chev"/><use href="#chev2"/></g>
    <g transform="rotate(300 320 320)"><use href="#chev"/><use href="#chev2"/></g>
  </g>

  <polygon points="350,320 335,294 305,294 290,320 305,346 335,346" fill="#0c1018" stroke="#9bf2ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="320" cy="320" r="8" fill="#e6fdff" filter="url(#glow)"/>

  <g fill="#ff4fd8" filter="url(#glow)">
    <circle cx="596" cy="320" r="5"/><circle cx="44" cy="320" r="5"/>
    <circle cx="458" cy="82" r="5"/><circle cx="182" cy="82" r="5"/>
    <circle cx="458" cy="558" r="5"/><circle cx="182" cy="558" r="5"/>
    <circle cx="530" cy="200" r="4"/><circle cx="110" cy="200" r="4"/><circle cx="530" cy="440" r="4"/><circle cx="110" cy="440" r="4"/>
    <circle cx="320" cy="78" r="4"/><circle cx="320" cy="562" r="4"/>
  </g>
</svg>
