<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <!-- Field-hospital tarp: canvas sheet staked to the ground with a painted red cross. Medieval / early industrial. 3x3 tiles. -->
  <!-- guy ropes to stakes -->
  <g stroke="#3b2c1a" stroke-width="5" stroke-linecap="round">
    <line x1="60" y1="62" x2="22" y2="24"/><line x1="324" y1="58" x2="364" y2="22"/>
    <line x1="328" y1="324" x2="362" y2="364"/><line x1="58" y1="322" x2="20" y2="358"/>
  </g>
  <g stroke="#b59a6a" stroke-width="2.5" stroke-linecap="round">
    <line x1="60" y1="62" x2="22" y2="24"/><line x1="324" y1="58" x2="364" y2="22"/>
    <line x1="328" y1="324" x2="362" y2="364"/><line x1="58" y1="322" x2="20" y2="358"/>
  </g>
  <!-- wooden stakes -->
  <g fill="#7a5430" stroke="#2e1d0e" stroke-width="3">
    <circle cx="20" cy="22" r="8"/><circle cx="366" cy="20" r="8"/><circle cx="364" cy="366" r="8"/><circle cx="18" cy="360" r="8"/>
  </g>

  <!-- canvas sheet, slightly crooked -->
  <path d="M54 58 L196 50 L330 56 L336 196 L330 330 L190 336 L52 328 L48 190 Z"
        fill="#d6c9a3" stroke="#3b3020" stroke-width="5" stroke-linejoin="round"/>
  <!-- hem -->
  <path d="M66 70 L196 63 L318 68 L323 196 L318 318 L190 323 L64 316 L61 190 Z"
        fill="none" stroke="#a8996f" stroke-width="2.5" stroke-dasharray="8 6"/>
  <!-- folds / creases -->
  <g fill="none" stroke="#b8aa80" stroke-width="4" stroke-linecap="round">
    <path d="M196 50 C192 120 200 260 190 336"/>
    <path d="M48 190 C130 186 260 198 336 196"/>
  </g>
  <g fill="#c4b68c" fill-opacity="0.6">
    <path d="M70 230 C110 220 130 260 100 300 C80 290 66 260 70 230 Z"/>
    <path d="M290 80 C310 100 316 130 300 150 C282 130 280 100 290 80 Z"/>
  </g>

  <!-- painted red cross, a bit uneven -->
  <path d="M164 108 L222 106 L224 164 L282 166 L280 222 L222 224 L220 282 L162 280 L164 224 L106 222 L108 166 L164 164 Z"
        fill="#a8261f" stroke="#4a110c" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#c03a30" fill-opacity="0.6"><circle cx="232" cy="290" r="4"/><circle cx="292" cy="230" r="3"/><circle cx="244" cy="298" r="2.5"/></g>

  <!-- stones holding the edges -->
  <g fill="#8c867a" stroke="#34302a" stroke-width="3.5">
    <path d="M178 40 c3 -9 20 -9 23 0 c3 9 -6 15 -13 14 c-7 -1 -12 -7 -10 -14 z"/>
    <path d="M330 184 c8 -4 18 4 15 13 c-3 8 -14 9 -18 3 c-3 -5 -2 -12 3 -16 z"/>
    <path d="M176 332 c4 -8 19 -7 21 2 c2 8 -7 13 -13 12 c-6 -1 -10 -7 -8 -14 z"/>
    <path d="M38 184 c6 -6 18 -2 18 7 c0 8 -10 12 -16 8 c-5 -3 -6 -10 -2 -15 z"/>
  </g>
</svg>
