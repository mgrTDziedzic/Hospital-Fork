    <path id="leaf" d="M0 0 C6 -8 18 -8 22 0 C18 8 6 8 0 0 Z"/>
    <polygon id="star4" points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4"/>
