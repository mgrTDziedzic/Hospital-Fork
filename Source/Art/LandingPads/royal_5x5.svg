    <polygon fill="#4b2466" points="192,140 204,180 244,192 204,204 192,244 180,204 140,192 180,180"/>
    <polygon fill="url(#gold)" points="192,156 200,184 228,192 200,200 192,228 184,200 156,192 184,184" transform="rotate(45 192 192)"/>
