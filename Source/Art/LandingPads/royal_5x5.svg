    <circle cx="507" cy="133" r="5"/><circle cx="133" cy="133" r="5"/><circle cx="507" cy="507" r="5"/><circle cx="133" cy="507" r="5"/>
    <use href="#star4" transform="translate(421 76)"/><use href="#star4" transform="translate(219 76)"/>
    <use href="#star4" transform="translate(421 564)"/><use href="#star4" transform="translate(219 564)"/>
    <use href="#star4" transform="translate(76 421)"/><use href="#star4" transform="translate(76 219)"/>
    <use href="#star4" transform="translate(564 421)"/><use href="#star4" transform="translate(564 219)"/>
