<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <!-- Royal pad, 5x5. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/><stop offset="0.5" stop-color="#d4a530"/><stop offset="1" stop-color="#9a7116"/>
    </linearGradient>
    <radialGradient id="marble" cx="0.4" cy="0.35" r="0.8">
